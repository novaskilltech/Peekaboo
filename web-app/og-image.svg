<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgDark" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#111b21"/>
      <stop offset="60%" stop-color="#0b141a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Green Glow -->
    <radialGradient id="glowGreen" cx="25%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#25d366" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#00a884" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Stealth Glow -->
    <radialGradient id="glowCyan" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- WhatsApp Gradient -->
    <linearGradient id="waGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2fe675"/>
      <stop offset="50%" stop-color="#25d366"/>
      <stop offset="100%" stop-color="#128c7e"/>
    </linearGradient>

    <!-- Anonymous Gradient -->
    <linearGradient id="anonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25d366"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <clipPath id="logoLeft">
      <rect x="0" y="0" width="130" height="260"/>
    </clipPath>
    <clipPath id="logoRight">
      <rect x="130" y="0" width="130" height="260"/>
    </clipPath>

    <!-- Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#25d366" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fond sombre WhatsApp Stealth -->
  <rect width="1200" height="630" fill="url(#bgDark)"/>
  <circle cx="300" cy="315" r="400" fill="url(#glowGreen)"/>
  <circle cx="950" cy="315" r="450" fill="url(#glowCyan)"/>

  <!-- Grille cybernétique discrète en filigrane -->
  <g stroke="rgba(255, 255, 255, 0.025)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Cadre décoratif extérieur -->
  <rect x="30" y="30" width="1140" height="570" rx="20" fill="none" stroke="rgba(37, 211, 102, 0.2)" stroke-width="1.5"/>
  <rect x="36" y="36" width="1128" height="558" rx="16" fill="none" stroke="rgba(0, 240, 255, 0.1)" stroke-width="1" stroke-dasharray="8,6"/>

  <!-- ================================================================= -->
  <!-- BLOC GAUCHE : LOGO OFFICIEL HYBRIDE AGRANDI (260x260)             -->
  <!-- ================================================================= -->
  <g transform="translate(100, 185)" filter="url(#cardShadow)">
    <!-- Moitié Gauche WhatsApp -->
    <g clip-path="url(#logoLeft)">
      <path d="M 130,25 C 72,25 25,72 25,130 C 25,150 31,169 41,185 L 30,230 L 77,218 C 93,227 111,232 130,232 C 188,232 235,185 235,130 C 235,72 188,25 130,25 Z" fill="url(#waGrad)"/>
      <path d="M 90,80 C 86,80 81,81 77,86 C 73,90 64,99 64,117 C 64,135 77,152 79,154 C 81,156 104,191 138,206 C 166,218 172,216 178,215 C 184,214 197,207 200,200 C 202,193 202,186 201,185 L 173,170 C 168,168 165,167 162,172 L 155,180 C 153,183 149,183 145,181 C 137,177 122,169 110,155 C 99,144 93,132 91,128 C 90,124 91,122 94,119 L 100,112 C 103,109 102,106 101,103 L 91,83 C 89,80 87,80 90,80 Z" fill="#ffffff"/>
    </g>

    <!-- Moitié Droite Anonymous -->
    <g clip-path="url(#logoRight)">
      <path d="M 130,25 C 72,25 25,72 25,130 C 25,150 31,169 41,185 L 30,230 L 77,218 C 93,227 111,232 130,232 C 188,232 235,185 235,130 C 235,72 188,25 130,25 Z" fill="url(#anonGrad)" stroke="url(#rimGrad)" stroke-width="3"/>
      
      <!-- Demi-Masque Anonymous blanc ivoire -->
      <path d="M 130,60 C 162,60 192,82 195,120 C 196,145 180,180 142,205 L 130,210 Z" fill="#f8fafc" opacity="0.95"/>
      <ellipse cx="172" cy="138" rx="8" ry="5" fill="#f43f5e" opacity="0.45"/>
      <!-- Sourcil & Oeil -->
      <path d="M 135,95 C 152,83 175,89 182,98" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
      <path d="M 137,108 Q 157,98 175,110 Q 157,115 137,108 Z" fill="#030712"/>
      <circle cx="157" cy="107" r="4" fill="#00f0ff"/>
      <circle cx="157" cy="107" r="1.5" fill="#ffffff"/>
      <!-- Moustache retroussée -->
      <path d="M 130,155 C 147,153 172,150 190,138 C 185,148 167,163 145,164 L 130,164 Z" fill="#090d16"/>
      <!-- Bouc -->
      <path d="M 130,185 C 140,185 145,193 140,205 L 130,206 Z" fill="#090d16"/>
    </g>

    <!-- Jonction Cyber -->
    <line x1="130" y1="25" x2="130" y2="232" stroke="#00f0ff" stroke-width="2" stroke-dasharray="7,3"/>
  </g>

  <!-- ================================================================= -->
  <!-- BLOC DROIT : TITRES & ARGUMENTAIRE MARKETING SOUVERAIN            -->
  <!-- ================================================================= -->
  
  <!-- Pill Badge -->
  <g transform="translate(420, 140)">
    <rect width="440" height="34" rx="17" fill="rgba(37, 211, 102, 0.1)" stroke="rgba(37, 211, 102, 0.4)" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#25d366"/>
    <text x="36" y="22" fill="#25d366" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.5">WHATSAPP STEALTH CLONE // AIR-GAP PROTOCOL</text>
  </g>

  <!-- Grand Titre de Marque -->
