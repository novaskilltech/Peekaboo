    PEEKABOO <tspan fill="#00f0ff">ANON</tspan>
  </text>

  <!-- Baseline / Slogan -->
  <text x="420" y="295" fill="#25d366" font-family="'Segoe UI', -apple-system, sans-serif" font-size="28" font-weight="600">
    Now you see it. Now you don't.
  </text>

  <!-- Descriptif Fort -->
  <text x="420" y="350" fill="#94a3b8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="400">
    La surcouche cryptographique indétectable pour WhatsApp &amp; Telegram.
  </text>
  <text x="420" y="380" fill="#cbd5e1" font-family="'Segoe UI', -apple-system, sans-serif" font-size="18" font-weight="500">
    Chiffrement asymétrique ECDH P-256 local • 0 Serveur • 100% Hors-ligne.
  </text>

  <!-- Bento Tags Grid en bas à droite -->
  <g transform="translate(420, 430)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="42" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="18" y="26" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="13">🛡️ ZERO-KNOWLEDGE</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(225, 0)">
      <rect width="210" height="42" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="18" y="26" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="13">🎭 CAMOUFLAGE WA</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(450, 0)">
      <rect width="230" height="42" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="18" y="26" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="13">⚡ PURGE RAM INSTANT</text>
    </g>
  </g>

  <!-- Mention Légale en bas à gauche -->
  <text x="100" y="555" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="14">
    Développé par <tspan fill="#25d366" font-weight="600">Nova Skill Tech</tspan> • Conforme RGPD • Licence Perpétuelle
  </text>

  <!-- URL Officielle en bas à droite -->
  <text x="1090" y="555" text-anchor="end" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" letter-spacing="1">
    peekaboo.novaskill.tech
  </text>
</svg>