<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#4facfe" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glassFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020b1c" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="glassFacet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7928ca" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="glassFacet3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#00df89" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#040a17" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="40%" stop-color="#4facfe"/>
      <stop offset="75%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00df89"/>
    </linearGradient>

    <radialGradient id="irisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00f2fe"/>
      <stop offset="75%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="250" cy="250" r="220" fill="url(#bgGlow)"/>

  <g filter="url(#neonShadow)">
    <polygon points="250,60 380,135 250,210 120,135" fill="url(#glassFacet1)" stroke="url(#neonRim)" stroke-width="2.5" stroke-opacity="0.85"/>
    <polygon points="120,135 250,210 250,360 120,285" fill="url(#glassFacet2)" stroke="url(#neonRim)" stroke-width="2.5" stroke-opacity="0.75"/>
    <polygon points="250,210 380,135 380,285 250,360" fill="url(#glassFacet3)" stroke="url(#neonRim)" stroke-width="2.5" stroke-opacity="0.8"/>
  </g>

  <line x1="250" y1="60" x2="250" y2="210" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="120" y1="135" x2="250" y2="210" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="380" y1="135" x2="250" y2="210" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="250" y1="210" x2="250" y2="360" stroke="#00df89" stroke-width="2" stroke-opacity="0.5"/>

  <circle cx="250" cy="210" r="70" fill="url(#irisGlow)" opacity="0.85"/>

  <g transform="translate(250, 210)">
    <path d="M -75,0 Q 0,-48 75,0 Q 0,48 -75,0 Z" fill="rgba(4, 9, 20, 0.82)" stroke="url(#neonRim)" stroke-width="3"/>
    <circle cx="0" cy="0" r="26" fill="#020617" stroke="#00f2fe" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="14" fill="#00f2fe" opacity="0.9"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>

    <line x1="-20" y1="-12" x2="-8" y2="-22" stroke="#4facfe" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="12" y1="-20" x2="22" y2="-8" stroke="#4facfe" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="12" x2="8" y2="22" stroke="#7928ca" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-12" y1="20" x2="-22" y2="8" stroke="#00df89" stroke-width="1.8" stroke-linecap="round"/>

    <ellipse cx="-7" cy="-7" rx="3.5" ry="2" fill="#ffffff" opacity="0.9" transform="rotate(-30 -7 -7)"/>
  </g>

  <circle cx="160" cy="95" r="4" fill="#00f2fe" filter="url(#neonShadow)"/>
  <circle cx="340" cy="95" r="4" fill="#00df89" filter="url(#neonShadow)"/>
  <circle cx="250" cy="395" r="4.5" fill="#7928ca" filter="url(#neonShadow)"/>
</svg>