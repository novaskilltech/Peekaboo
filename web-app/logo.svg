<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="ambientCyan" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientViolet" cx="70%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Capsule Bevel Border -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.6)"/>
      <stop offset="35%" stop-color="rgba(255, 255, 255, 0.12)"/>
      <stop offset="70%" stop-color="rgba(139, 92, 246, 0.45)"/>
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.7)"/>
    </linearGradient>

    <!-- Frosted Glass Surface Tint -->
    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)"/>
      <stop offset="50%" stop-color="rgba(23, 26, 38, 0.65)"/>
      <stop offset="100%" stop-color="rgba(7, 9, 14, 0.85)"/>
    </linearGradient>

    <!-- Top Specular Gloss Highlight -->
    <linearGradient id="specularGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.0)"/>
    </linearGradient>

    <!-- Prism Geometry Stroke Gradient -->
    <linearGradient id="prismStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.75)"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#06B6D4" flood-opacity="0.3"/>
    </filter>

    <!-- Core Neon Glow Filter -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Light Orbs -->
  <rect x="36" y="36" width="440" height="440" rx="110" fill="url(#ambientCyan)" opacity="0.6"/>
  <rect x="36" y="36" width="440" height="440" rx="110" fill="url(#ambientViolet)" opacity="0.6"/>

  <!-- Master Glassmorphism Shield -->
  <g filter="url(#glassShadow)">
    <!-- Base Frosted Slab -->
    <rect x="46" y="46" width="420" height="420" rx="100" fill="url(#glassSurface)" stroke="url(#glassBorder)" stroke-width="2.5"/>

    <!-- Inner Specular Light Shelf -->
    <path d="M 52,146 C 52,94 94,52 146,52 L 366,52 C 418,52 460,94 460,146 L 460,180 C 370,195 142,195 52,180 Z" fill="url(#specularGleam)"/>

    <!-- Micro-grid Stealth Accents -->
    <g opacity="0.18" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="4 8">
      <line x1="120" y1="256" x2="392" y2="256"/>
      <line x1="256" y1="120" x2="256" y2="392"/>
    </g>

    <!-- Stealth Aperture & Prismatic Shield (Geometric Center) -->
    <!-- Outer Shield Contour -->
    <path d="M 256,140 C 290,140 356,170 376,240 C 356,310 290,340 256,340 C 222,340 156,310 136,240 C 156,170 222,140 256,140 Z" 
          stroke="url(#prismStroke)" stroke-width="4.5" stroke-linejoin="round" fill="rgba(6, 182, 212, 0.04)"/>

    <!-- Inner Refraction Diamond -->
    <polygon points="256,175 320,240 256,305 192,240" 
             stroke="rgba(139, 92, 246, 0.55)" stroke-width="2.5" fill="none"/>

    <!-- Electric Cyan Glowing Iris -->
    <circle cx="256" cy="240" r="32" fill="#06B6D4" filter="url(#coreGlow)"/>
    <circle cx="256" cy="240" r="18" fill="#FFFFFF"/>
    <circle cx="264" cy="232" r="5" fill="#FFFFFF" opacity="0.9"/>

    <!-- Base Horizon Keyhole Arch -->
    <path d="M 240,375 L 272,375 L 268,395 L 244,395 Z" fill="rgba(255,255,255,0.2)"/>
    <circle cx="256" cy="365" r="4" fill="#38BDF8"/>
  </g>
</svg>